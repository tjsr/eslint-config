name: Test shared ESLint configuration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', '26']
        eslint-js: ['9.39.5', '10.0.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use latest npm
        run: npm install --global npm@latest
      - run: npm ci
      - run: npm install --no-save --package-lock=false --strict-peer-deps @eslint/js@${{ matrix.eslint-js }}
      - run: npm test
        env:
          ESLINT_JS_VERSION: ${{ matrix.eslint-js }}
