version: 2
updates:
  - package-ecosystem: 'npm'
    rebase-strategy: auto
    directory: '/'
    schedule:
      interval: 'daily'
    assignees:
    - 'tjsr'
    ignore:
      - dependency-name: '@types/node'
        update-types: ["version-update:semver-major"]
    groups:
      typescript:
        applies-to: version-updates
        patterns:
        - "typescript"
        - "@typescript-eslint/*"
        - "typescript-eslint"
      eslint:
        applies-to: version-updates
        patterns:
        - "@stylistic/*"
        - "@eslint/*"
        - "eslint-*"
        - "eslint"
  - package-ecosystem: "github-actions"
    rebase-strategy: auto
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    assignees:
      - 'tjsr'

