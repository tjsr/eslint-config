version: 2
updates:
  - package-ecosystem: 'npm'
    rebase-strategy: auto
    directory: '/'
    schedule:
      interval: 'daily'
    assignees:
    - 'tjsr'
    ignore:
      - dependency-name: '@types/node'
        update-types: ["version-update:semver-major"]
    groups:
      eslint:
        applies-to: version-updates
        patterns:
          - "@stylistic/*"
          - "@eslint/*"
          - "eslint-*"
          - "eslint"
          - "globals"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "prettier-plugin-*"
      development:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    rebase-strategy: auto
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    assignees:
      - 'tjsr'

